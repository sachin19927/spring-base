services:
  postgres:
    image: 'postgres:latest'
    environment:
        POSTGRES_DB: deliverydb
        POSTGRES_PASSWORD: sachin.hs
        POSTGRES_USER: sachin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sachin -d deliverydb"]
      interval: 5s
      timeout: 5s
      retries: 10
  mock-api:
    image: "wiremock/wiremock:3.5.2"
    ports:
      - "8000:8000"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    entrypoint: ["/docker-entrypoint.sh", "--port=8000"]

volumes:
  postgres_data:

